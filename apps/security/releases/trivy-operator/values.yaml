affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role/worker
              operator: In
              values:
                - "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

operator:
  # Pin the operator replica count in Git so an out-of-band scale-down shows up in
  # `helmfile diff` and is reasserted by `helmfile apply` (chart default is 1).
  replicas: 1
  # Talos has an immutable root filesystem with no /etc/systemd, so the node-collector
  # Job (CIS node checks) fails every run with CreateContainerError. Disable infra
  # assessment, and cluster compliance which depends on node-collector data.
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  # Emit per-CVE metrics so the Grafana dashboard can show top vulnerabilities.
  metricsVulnIdEnabled: true
  # Restrict reconciliation to these resource kinds to reduce noise in a homelab.
  targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job"
  # Give scan jobs enough time to pull the trivy image and complete the scan.
  scanJobTimeout: 5m
  # Limit concurrent scan jobs to 2 to prevent cache-lock races on multi-container pods
  # (Grafana, Prometheus, Cilium, Longhorn all have sidecars that spawn simultaneous
  # scan jobs which race on a shared trivy cache path — issue #63).
  # Default is 10; a lower value serialises scans enough to avoid the lock contention.
  scanJobsConcurrentLimit: 2

# Node-collector is effectively disabled (operator.infraAssessmentScannerEnabled: false),
# so these tolerations are inert; kept so re-enabling on a non-Talos node still works.
nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

trivy:
  # Only surface vulnerabilities that have a fix available — reduces noise.
  ignoreUnfixed: true
  severity: CRITICAL,HIGH
  # Standalone mode: Trivy binary embedded in the scan Job; no separate server needed.
  mode: Standalone
  # Scan job container resources (default chart limit is 500M, which OOMKilled the
  # scan job for langfuse-web:3.201.1 — a larger Node.js image with a deep dependency
  # tree needs more headroom for Trivy's SBOM/vuln analysis. Issue #67.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

serviceMonitor:
  enabled: true
  labels:
    release: prometheus

# Disable compliance reports (CIS, NSA, PSS benchmarks). The chart creates
# ClusterComplianceReport instances by default, which require the CRD to exist
# before `helm diff` can render the manifest — a bootstrapping catch-22.
# Vulnerability scanning is what we need; compliance auditing is out of scope.
compliance:
  specs: []
