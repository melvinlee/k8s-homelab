global:
  # All backing-store PVCs (postgresql, clickhouse, valkey, minio) are Bitnami
  # subcharts and honour this global — keeps every volume on Longhorn.
  defaultStorageClass: longhorn
  security:
    # The bundled stores default to bitnamilegacy/* images (Bitnami moved the
    # free tier there); this flag is required for the chart to accept them.
    allowInsecureImages: true

# Core Langfuse Configuration (web + worker deployments)
langfuse:
  features:
    # Homelab privacy stance — matches grafana (analytics/reporting disabled).
    telemetryEnabled: false
    # Leave sign-up open so the first admin account can be created, then flip to
    # true after onboarding to lock the instance down.
    signUpDisabled: false

  # salt / nextauth.secret / encryptionKey are supplied via the gitignored
  # resources/secret.yaml (merged on top of this file by helmfile.yaml).

  nextauth:
    # Must be the canonical externally-reachable URL (the HTTPRoute hostname).
    url: http://langfuse.home

  # Keep langfuse pods on worker nodes (control-plane is tainted NoSchedule, but
  # this is explicit and mirrors the grafana release).
  nodeSelector:
    node-role/worker: "true"

  # Run non-root and drop capabilities so the pods satisfy PodSecurity.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  web:
    # langfuse-web is a Next.js SSR app. Node sizes its V8 heap to ~half the
    # container memory limit, so a 1Gi limit caps the heap at ~512Mi and the pod
    # aborts with "heap out of memory" (exit 134) during init. Give it 2Gi and
    # pin the heap explicitly so it can grow without relying on cgroup detection.
    pod:
      additionalEnv:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi

  worker:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

# PostgreSQL — transactional / config data (Bitnami subchart)
#
# Image pinning note (issue #67): Bitnami's free tier moved to the frozen
# bitnamilegacy/* registry in Aug 2025 and stopped rebuilding it. The
# non-legacy bitnami/postgresql repo still exists, but only ever publishes a
# mutable `latest` tag + content-addressable sha256 aliases now — no pinned
# semver tag to point at, so it's not usable for a reproducible GitOps pin.
# bitnamilegacy/postgresql kept receiving pushes for a few months after the
# split before going fully frozen on 2025-08-28 — 17.6.0-debian-12-r4 is that
# repo's terminal (last-ever-published) tag, still pullable. Any residual
# CRITICAL/HIGH after this bump (CVEs disclosed after the 2025-08-28 freeze)
# is a risk-accepted exception: this cluster is internal-LAN only, not
# internet-exposed.
postgresql:
  deploy: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  # auth.password comes from resources/secret.yaml
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Valkey / Redis — queue + cache (Bitnami subchart)
#
# Image pinning note (issue #67): we TESTED bitnamilegacy/valkey's terminal
# tag (8.1.3-debian-12-r3, frozen 2025-08-08) and it made things worse, not
# better — it introduced CVE-2025-49844, a valkey application-level CRITICAL
# fixed only in 8.1.4/8.0.6/7.2.11, none of which ever shipped to
# bitnamilegacy (the freeze predates the fix). Its openssl/libssl3 also only
# reached an intermediate 3.0.17-1~deb12u1, short of the 3.0.19 fix. Net
# result: 5→7 CRITICAL, 48→58 HIGH. We deliberately stay on the original
# 8.0.2-debian-12-r2 and risk-accept its residual CRITICAL/HIGH instead —
# this cluster is internal-LAN only, not internet-exposed, and the newer tag
# is strictly worse.
redis:
  deploy: true
  image:
    registry: docker.io
    repository: bitnamilegacy/valkey
    tag: 8.0.2-debian-12-r2
  # auth.password comes from resources/secret.yaml
  primary:
    # Required by langfuse — the queue must never evict keys.
    extraFlags:
      - "--maxmemory-policy noeviction"
    persistence:
      enabled: true
      size: 4Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

# ClickHouse — traces/observations OLAP store (Bitnami subchart)
# Chart defaults are production HA sizing (replicaCount 3, resourcesPreset
# 2xlarge ≈ 7 CPU / 20Gi). Slim to a single node for the homelab.
#
# Image pinning note (issue #67): same bitnamilegacy situation as postgresql
# above, except bitnami/clickhouse (non-legacy) has been fully discontinued
# from the free tier (404 on `latest`) — there is no maintained alternative
# at all, pinnable or not. bitnamilegacy/clickhouse's terminal tag (frozen
# 2025-08-27) is 25.7.5-debian-12-r0 — a 5-minor-version jump from
# 25.2.1, still same registry/repo/layout. A VolumeSnapshot of the data PVC
# was taken before this bump given the version jump. Residual CRITICAL/HIGH
# is a risk-accepted exception (internal-LAN homelab, not internet-exposed).
clickhouse:
  deploy: true
  image:
    registry: docker.io
    repository: bitnamilegacy/clickhouse
    tag: 25.7.5-debian-12-r0
  replicaCount: 1
  resourcesPreset: none # disable the 2xlarge preset; explicit resources below win
  # auth.password comes from resources/secret.yaml
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
  # With replicaCount 1 the chart sets CLICKHOUSE_CLUSTER_ENABLED=false, so langfuse
  # uses non-replicated MergeTree tables and needs no coordinator — drop the bundled
  # Zookeeper (default is a 3-node ensemble) entirely.
  zookeeper:
    enabled: false

# MinIO — event & media blob storage (Bitnami subchart)
#
# Image pinning note (issue #67): we TESTED bitnamilegacy/minio's terminal
# tag (2025.7.23-debian-12-r5, frozen 2025-08-19) and it made things worse,
# not better — the newer build bundles substantially more embedded
# dependencies than the 2024.12.18 image (Prometheus client, OpenTelemetry
# SDK, go-jose, jsonparser, thrift, jq — none present in the old image's
# SBOM) plus two new minio application CRITICALs disclosed after this
# build's cutoff (CVE-2026-33419, CVE-2026-33322). Net result: 9→14
# CRITICAL, 129→163 HIGH. minio is also a special case regardless of tag:
# the binary statically compiles Go's stdlib/x-crypto/x-net, so no
# bitnamilegacy tag can clear CVEs disclosed after its build date, and
# upstream minio/minio has an incompatible entrypoint/command contract with
# this Bitnami subchart (swapping to it is a migration, not a tag bump). We
# deliberately stay on the original 2024.12.18-debian-12-r1 and risk-accept
# its residual CRITICAL/HIGH instead — this cluster is internal-LAN only,
# not internet-exposed, and the newer tag is strictly worse.
s3:
  deploy: true
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: 2024.12.18-debian-12-r1
  defaultBuckets: langfuse
  # auth.rootPassword comes from resources/secret.yaml
  mode: standalone
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
