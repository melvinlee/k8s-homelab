---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: langfuse
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Langfuse"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "langfuse.png"
    gethomepage.dev/description: "LLM observability and tracing"
    gethomepage.dev/pod-selector: "app=web"
spec:
  parentRefs:
    - name: homelab
      namespace: infra
  hostnames:
    - langfuse.home
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: langfuse-web
          port: 3000
