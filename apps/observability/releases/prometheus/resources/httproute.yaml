---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Prometheus"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "prometheus.png"
    gethomepage.dev/description: "Metrics and target health"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=prometheus"
    gethomepage.dev/widget.type: "prometheus"
    gethomepage.dev/widget.url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
spec:
  parentRefs:
    - name: homelab
      namespace: infra
  hostnames:
    - prometheus.home
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
