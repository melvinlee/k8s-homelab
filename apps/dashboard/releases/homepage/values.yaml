# Homepage dashboard (jameswynn/homepage chart). Stateless; services are discovered
# from Gateway API HTTPRoute annotations (gethomepage.dev/*). See ADR-0012.
image:
  repository: ghcr.io/gethomepage/homepage
  tag: v1.2.0

enableRbac: true # read-only ClusterRole: nodes/namespaces/pods, httproutes, metrics.k8s.io

serviceAccount:
  create: true
  name: homepage

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.home
  - name: TZ
    value: Asia/Kuala_Lumpur

config:
  kubernetes:
    mode: cluster
    gateway: true
  # Discovery supplies all services; no static entries.
  services: []
  bookmarks: []
  settingsString: |
    title: Homelab
    headerStyle: boxed
    layout:
      Observability:
      Storage:
      Network:
      AI:
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local
  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    # Longhorn URL comes from settings.yaml providers.longhorn (info widget reads it there).
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

persistence:
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/config/logs
  nextcache:
    enabled: true
    type: emptyDir
    mountPath: /app/.next/cache
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp

# Run on workers, matching the other app releases.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
