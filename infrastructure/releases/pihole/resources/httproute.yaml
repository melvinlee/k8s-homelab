---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: infra
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Pi-hole"
    gethomepage.dev/group: "Network"
    gethomepage.dev/icon: "pi-hole.png"
    gethomepage.dev/description: "DNS and ad blocking"
    gethomepage.dev/pod-selector: "app=pihole"
spec:
  parentRefs:
    - name: homelab
      namespace: infra
  hostnames:
    - pihole.home
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pihole-web
          port: 80
